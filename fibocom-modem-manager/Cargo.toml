[package]
name = "fibocom-modem-manager"
version = "1.0.0"
edition = "2021"
description = "Fibocom 模组 PC 管理工具 (复用原厂 WEBUI)"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4.10", default-features = false }
regex = "1"
include_dir = "0.7"
percent-encoding = "2"
chrono = { version = "0.4", features = ["clock"] }

[profile.release]
opt-level = 2
lto = true
strip = true

[[bin]]
name = "fibocom-modem-manager"
path = "src/main.rs"
